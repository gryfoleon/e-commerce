management:
  server:
    port: 9090
    address: localhost
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true
    java:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  pre-loading-enabled: true

spring:
  application:
    name: ecommerce-api
  mvc:
    servlet:
      path: /
  web:
    resources:
      add-mappings: false
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_HOST}:${POSTGRESQL_PORT}/${POSTGRESQL_DBNAME}
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver
    connection-fetch: eager
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      connection-test-query: "SELECT 1"
      leak-detection-threshold: 60000
      initialization-fail-timeout: 1
      data-source-properties:
        socketTimeout: 30
        tcpKeepAlives: true
        connectTimeout: 30000
      pool-name: auth-api-db-pool
      register-mbeans: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: schema
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 1s
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 1MB
  threads:
    virtual:
      enabled: true
  main:
    lazy-initialization: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    max-age: 1h
  idempotency:
    key-prefix: "idempotency-key:"
    lock-ttl: 30s
    record-ttl: 24h
  ingestion:
    batch-size: 1000
    max-reported-errors: 1000
    max-concurrent-batches: 4
    idempotency-lock-ttl: 10m
  cache:
    enabled: ${PRODUCT_CACHE_ENABLED:true}
    key-prefix: "product:v1:"
    detail-ttl: 6h
    query-ttl: 30s
