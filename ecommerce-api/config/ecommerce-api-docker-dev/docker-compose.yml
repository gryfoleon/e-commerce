networks:
  local-net:
    name: local-net
  default:
    external: true
    name: local-net

services:
  ecommerce-api-postgres:
    image: postgres:18.6
    container_name: ecommerce-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce-api
      POSTGRES_USER: ecommerce-api
      POSTGRES_PASSWORD: ecommerce-api
    ports:
      - "5450:5432"
    volumes:
      - ${volume}/postgresql/init_db:/docker-entrypoint-initdb.d
      - ${volume}/postgresql/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce-api -d ecommerce-api"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - local-net

  ecommerce-api-valkey:
    image: valkey/valkey:9.1.3
    container_name: ecommerce-api-valkey
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - ${volume}/valkey:/data
    command: valkey-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - local-net
